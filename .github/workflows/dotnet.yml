name: BuildTestAndStaticAnalysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-static-analysis:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Coverlet
        run: dotnet tool install --global coverlet.console
      - name: Install sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin Sonar scan
        run: dotnet sonarscanner begin /k:"Jean-Jensen_HotelBooking_Mini_Project" /o:"github-jean-jensen" /d:sonar.token="$TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.cs.opencover.reportsPaths=coverage.xml

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Debug

      - name: Collect code coverage using Coverlet
        run: coverlet ./HotelBooking.UnitTests/bin/HotelBooking.UnitTests.dll --target "dotnet" --targetargs "test --no-build" -f=opencover -o="coverage.xml"

      - name: End Sonar scan
        run: dotnet sonarscanner end /d:sonar.token="$TOKEN"